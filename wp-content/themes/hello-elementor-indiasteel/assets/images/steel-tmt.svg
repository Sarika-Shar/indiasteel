<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="tmtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#tmtBg)"/>
  
  <!-- TMT Ribbed Bars Stack -->
  <g transform="translate(30, 60)">
    <!-- Bar 1 -->
    <rect x="0" y="20" width="340" height="22" rx="4" fill="url(#barMetal)"/>
    <!-- Ribs pattern on Bar 1 -->
    <path d="M 20 20 L 35 42 M 50 20 L 65 42 M 80 20 L 95 42 M 110 20 L 125 42 M 140 20 L 155 42 M 170 20 L 185 42 M 200 20 L 215 42 M 230 20 L 245 42 M 260 20 L 275 42 M 290 20 L 305 42" stroke="#0f172a" stroke-width="2.5" opacity="0.6"/>
    <path d="M 22 20 L 37 42 M 52 20 L 67 42 M 82 20 L 97 42 M 112 20 L 127 42 M 142 20 L 157 42 M 172 20 L 187 42 M 202 20 L 217 42 M 232 20 L 247 42 M 262 20 L 277 42 M 292 20 L 307 42" stroke="#e2e8f0" stroke-width="1.5" opacity="0.7"/>

    <!-- Bar 2 -->
    <rect x="20" y="55" width="320" height="22" rx="4" fill="url(#barMetal)"/>
    <path d="M 40 55 L 55 77 M 70 55 L 85 77 M 100 55 L 115 77 M 130 55 L 145 77 M 160 55 L 175 77 M 190 55 L 205 77 M 220 55 L 235 77 M 250 55 L 265 77 M 280 55 L 295 77" stroke="#0f172a" stroke-width="2.5" opacity="0.6"/>
    <path d="M 42 55 L 57 77 M 72 55 L 87 77 M 102 55 L 117 77 M 132 55 L 147 77 M 162 55 L 177 77 M 192 55 L 207 77 M 222 55 L 237 77 M 252 55 L 267 77 M 282 55 L 297 77" stroke="#e2e8f0" stroke-width="1.5" opacity="0.7"/>

    <!-- Bar 3 -->
    <rect x="0" y="90" width="340" height="22" rx="4" fill="url(#barMetal)"/>
    <path d="M 20 90 L 35 112 M 50 90 L 65 112 M 80 90 L 95 112 M 110 90 L 125 112 M 140 90 L 155 112 M 170 90 L 185 112 M 200 90 L 215 112 M 230 90 L 245 112 M 260 90 L 275 112 M 290 90 L 305 112" stroke="#0f172a" stroke-width="2.5" opacity="0.6"/>
    <path d="M 22 90 L 37 112 M 52 90 L 67 112 M 82 90 L 97 112 M 112 90 L 127 112 M 142 90 L 157 112 M 172 90 L 187 112 M 202 90 L 217 112 M 232 90 L 247 112 M 262 90 L 277 112 M 292 90 L 307 112" stroke="#e2e8f0" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Grade Badge -->
  <rect x="20" y="20" width="120" height="26" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="37" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">Fe 550D / 500D</text>
  <text x="380" y="36" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="end">8mm - 32mm Primary Mills</text>
</svg>
