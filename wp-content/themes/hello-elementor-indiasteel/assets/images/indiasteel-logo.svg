<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Industrial Icon: Heavy I-Beam & Molten Spark -->
  <g transform="translate(6, 4)">
    <!-- Hexagonal steel nut background -->
    <polygon points="28,2 50,14 50,42 28,54 6,42 6,14" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <polygon points="28,6 46,16 46,40 28,50 10,40 10,16" fill="#0f172a" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    
    <!-- Heavy I-Beam Cross Section in Center -->
    <path d="M 18,16 L 38,16 L 38,20 L 31,22 L 31,34 L 38,36 L 38,40 L 18,40 L 18,36 L 25,34 L 25,22 L 18,20 Z" fill="url(#metalGrad)" stroke="#334155" stroke-width="0.75"/>
    
    <!-- Molten spark flame -->
    <circle cx="28" cy="28" r="4" fill="url(#amberGrad)" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <text x="68" y="34" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="25" font-weight="900" letter-spacing="1.5" fill="#f8fafc">
    INDIA<tspan fill="#f59e0b">STEEL</tspan>
  </text>
  <text x="69" y="49" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="3.2" fill="#94a3b8">
    SCRAP &amp; INDUSTRIAL STEEL
  </text>
</svg>
