<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="metalGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amberGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Industrial Icon: Heavy I-Beam & Molten Spark -->
  <g transform="translate(6, 4)">
    <!-- Hexagonal steel nut background -->
    <polygon points="28,2 50,14 50,42 28,54 6,42 6,14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="28,6 46,16 46,40 28,50 10,40 10,16" fill="#e2e8f0" stroke="#ea580c" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Heavy I-Beam Cross Section in Center -->
    <path d="M 18,16 L 38,16 L 38,20 L 31,22 L 31,34 L 38,36 L 38,40 L 18,40 L 18,36 L 25,34 L 25,22 L 18,20 Z" fill="url(#metalGradDark)" stroke="#0f172a" stroke-width="0.75"/>
    
    <!-- Molten spark flame -->
    <circle cx="28" cy="28" r="4.5" fill="url(#amberGradDark)"/>
  </g>

  <!-- Typography for Light Background -->
  <text x="68" y="34" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="25" font-weight="900" letter-spacing="1.5" fill="#0f172a">
    INDIA<tspan fill="#ea580c">STEEL</tspan>
  </text>
  <text x="69" y="49" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="3.2" fill="#475569">
    SCRAP &amp; INDUSTRIAL STEEL
  </text>
</svg>
