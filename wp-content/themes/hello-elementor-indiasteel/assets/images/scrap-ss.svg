<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="ssBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#ssBg)"/>

  <!-- Stainless Steel Scrap / Coils & Turnings -->
  <g transform="translate(40, 50)">
    <!-- Polished SS Pipe Cutoff -->
    <ellipse cx="90" cy="110" rx="35" ry="55" fill="url(#chrome)" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="90" cy="110" rx="28" ry="46" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 90,55 L 220,40 C 240,40 255,65 255,95 C 255,125 240,150 220,150 L 90,165" fill="none" stroke="url(#chrome)" stroke-width="12"/>
    <ellipse cx="220" cy="95" rx="35" ry="55" fill="url(#chrome)" opacity="0.9"/>
    <ellipse cx="220" cy="95" rx="28" ry="46" fill="#1e293b"/>

    <!-- High gloss specular reflection -->
    <path d="M 100,68 L 225,52" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Grade Badge -->
  <rect x="20" y="20" width="130" height="26" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <text x="85" y="37" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#10b981" text-anchor="middle">SS 304 &amp; SS 316</text>
  <text x="380" y="36" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="end">Non-Magnetic Industrial Scrap</text>
</svg>
