<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="billetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="billetSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowingHeat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#billetBg)"/>

  <!-- Billets Stack -->
  <g transform="translate(60, 60)">
    <!-- Billet 1 (Semi-hot glow) -->
    <polygon points="10,40 50,20 180,20 140,40" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
    <polygon points="10,40 140,40 140,75 10,75" fill="url(#billetSteel)" stroke="#334155" stroke-width="1"/>
    <polygon points="140,40 180,20 180,55 140,75" fill="#475569" stroke="#334155" stroke-width="1"/>

    <!-- Billet 2 (Induction heated end) -->
    <polygon points="110,70 150,50 280,50 240,70" fill="url(#glowingHeat)" stroke="#d97706" stroke-width="1"/>
    <polygon points="110,70 240,70 240,105 110,105" fill="url(#billetSteel)" stroke="#334155" stroke-width="1"/>
    <polygon points="240,70 280,50 280,85 240,105" fill="url(#glowingHeat)" stroke="#d97706" stroke-width="1"/>

    <!-- Billet 3 (Bottom) -->
    <polygon points="30,95 70,75 200,75 160,95" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
    <polygon points="30,95 160,95 160,130 30,130" fill="url(#billetSteel)" stroke="#334155" stroke-width="1"/>
    <polygon points="160,95 200,75 200,110 160,130" fill="#475569" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Grade Badge -->
  <rect x="20" y="20" width="130" height="26" rx="4" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1.5"/>
  <text x="85" y="37" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f97316" text-anchor="middle">MS Billets &amp; Ingots</text>
  <text x="380" y="36" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="end">100x100 / 125x125 mm</text>
</svg>
