<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="20%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#pipeBg)"/>

  <!-- Steel Hollow Sections & Pipes -->
  <g transform="translate(60, 50)">
    <!-- Round Pipe 1 -->
    <ellipse cx="60" cy="110" rx="30" ry="30" fill="url(#pipeGrad)" stroke="#475569" stroke-width="2"/>
    <ellipse cx="60" cy="110" rx="22" ry="22" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <polygon points="60,80 260,30 260,140 60,140" fill="url(#pipeGrad)" opacity="0.85"/>
    <ellipse cx="260" cy="85" rx="30" ry="30" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="260" cy="85" rx="22" ry="22" fill="#1e293b"/>

    <!-- Square Hollow Section (SHS) -->
    <g transform="translate(10, 20)">
      <rect x="100" y="70" width="45" height="45" rx="4" fill="none" stroke="#e2e8f0" stroke-width="6"/>
      <polygon points="145,70 230,45 230,90 145,115" fill="#475569" stroke="#334155"/>
      <polygon points="100,70 145,70 230,45 185,45" fill="#cbd5e1" stroke="#334155"/>
    </g>
  </g>

  <!-- Grade Badge -->
  <rect x="20" y="20" width="130" height="26" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="85" y="37" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#06b6d4" text-anchor="middle">MS &amp; GI Pipes (IS 1239)</text>
  <text x="380" y="36" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="end">Round, Square &amp; Rectangular</text>
</svg>
